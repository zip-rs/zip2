[profile.default-miri]
slow-timeout = { period = "1m", terminate-after = 2 }

[[profile.default-miri.overrides]]
filter = "test(slow_in_miri)"
slow-timeout = { period = "1m", terminate-after = 5 }

[profile.default]
slow-timeout = { period = "1m", terminate-after = 10 }

[test-groups]
toctou-race = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(toctou_intermediate_symlink_race) & test(race)"
test-group = "toctou-race"