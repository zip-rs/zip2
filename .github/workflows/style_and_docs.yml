name: Style and Docs
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style_and_docs:
    timeout-minutes: 10
    strategy:
      matrix:
        feature_flag: [ "--all-features", "--no-default-features", "" ]
    name: "Style and docs ${{ matrix.feature_flag }}"
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    permissions:
      contents: read
      security-events: write # for SARIF upload
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          components: clippy
          bins: clippy-sarif, sarif-fmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run clippy - inside bash for pipefail
        shell: bash
        # allow warnings but not errors
        run: cargo clippy --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/Cargo.toml --message-format=json -- -D warnings | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      - name: Run clippy - inside bash for pipefail
        shell: bash
        # allow warnings but not errors
        run: cargo clippy --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml --message-format=json -- -D warnings | clippy-sarif | tee fuzz-clippy-results.sarif | sarif-fmt
      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rust-clippy-results.sarif
          category: main
          wait-for-processing: true
      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: fuzz-clippy-results.sarif
          category: fuzz
          wait-for-processing: true
      - run: cargo doc --no-deps --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/Cargo.toml
      - run: cargo doc --no-deps --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml