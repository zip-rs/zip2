name: CI
permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ (github.ref == 'refs/heads/master' && github.sha) || (github.event_name == 'pull_request' && github.head_ref) || github.ref }}
  cancel-in-progress: false

env:
  RUSTFLAGS: -Dwarnings
  # Short smoke fuzz for PRs and the merge queue; long campaigns live in fuzz-scheduled.yml
  FUZZ_SECONDS: 600
  MACOSX_DEPLOYMENT_TARGET: "14.5"

jobs:
  miri:
    needs:
    - cargo_semver
    - style_and_docs
    - cargo_fmt
    timeout-minutes: 25
    strategy:
      matrix:
        feature:
          - { key: miri-compatible, flags: "--no-default-features --features zip/_miri_compatible_features" }
          - { key: no-default-features, flags: "--no-default-features" }
    name: "Miri ${{ matrix.feature.key }} Cargo.toml"
    runs-on: ${{ vars.LINUX_RUNNER_CI_MIRI || 'blacksmith-4vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          bins: cargo-nextest
          components: miri
          targets: s390x-unknown-linux-gnu
          cache-extra-identifier: miri-${{ runner.os }}-${{ runner.arch }}-${{ matrix.feature.key }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross compiler
        shell: bash
        run: |
          set +e
          (
            sudo apt-get update &&
            sudo apt-get install --no-install-recommends -y gcc-s390x-linux-gnu libc6-dev-s390x-cross
          )
      - run: cargo miri nextest run --manifest-path ${{ github.workspace }}/Cargo.toml --target s390x-unknown-linux-gnu --all ${{ matrix.feature.flags }} --lib --bins --tests --examples
  bsd_platform:
    needs:
    - cargo_semver
    - style_and_docs
    - cargo_fmt
    timeout-minutes: 20
    name: "BSD checks"
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          bins: cargo-nextest, cargo-zigbuild
          targets: x86_64-unknown-freebsd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install zig
        shell: bash
        run: sudo snap install --beta zig --classic
      - run: cargo zigbuild --all-features --target x86_64-unknown-freebsd --all --lib --bins --tests --examples --benches
  check_minimal_versions:
    needs:
      - cargo_semver
      - style_and_docs
      - cargo_fmt
    timeout-minutes: 15
    strategy:
      matrix:
        # Only check minimal versions for the released library.
        workspace: ["Cargo.toml"]
    runs-on: ${{ vars.LINUX_RUNNER_CI_UNIT_TESTS || 'ubuntu-latest' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          bins: cargo-nextest
          cache-extra-identifier: ${{ runner.os }}-cargo-minimal-versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve minimal versions
        run: cargo -Z minimal-versions update --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
      - name: check
        run: cargo check --all-features --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
      - name: test
        run: cargo nextest run --all-features --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
  style_and_docs:
    timeout-minutes: 10
    strategy:
      matrix:
        workspace: ["Cargo.toml", "fuzz/Cargo.toml"]
        feature_flag: ["--all-features", "--no-default-features", ""]
    permissions:
      security-events: write # for SARIF upload
    name: "Style and docs ${{ matrix.feature_flag }} ${{ matrix.workspace }}"
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          components: clippy
          bins: clippy-sarif, sarif-fmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run clippy - inside bash for pipefail
        shell: bash
        # allow warnings but not errors
        run: cargo clippy --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/${{ matrix.workspace }} --message-format=json -- -D warnings | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
      - run: cargo doc --no-deps --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
  dependency_review:
    timeout-minutes: 20
    name: 'Dependency Review'
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            api.deps.dev:443
            api.securityscorecards.dev:443
      - name: 'Checkout Repository'
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  build_and_test:
    timeout-minutes: 30
    needs:
      - cargo_fmt
      - style_and_docs
      - cargo_semver
      - dependency_review
    if: needs.dependency_review.result == 'success' || needs.dependency_review.result == 'skipped'
    strategy:
      matrix:
        runner:
          - { alias: windows-latest, id: windows-latest }
          - { alias: macOS-latest, id: macOS-latest }
          - { alias: ubuntu-latest, id: "${{ vars.LINUX_RUNNER_CI_UNIT_TESTS || 'ubuntu-latest' }}" }
        feature:
          - { key: all-features, flags: "--all-features" }
          - { key: default, flags: "" }
          - { key: zlib-rs, flags: "--no-default-features --features zip/deflate-flate2-zlib-rs" }
          - { key: zopfli, flags: "--no-default-features --features zip/deflate-zopfli" }
          - { key: no-default-features, flags: "--no-default-features" }
        rustalias: [msrv, stable, nightly]
        include:
          - rustalias: msrv
            rust: "1.88.0"
          - rustalias: stable
            rust: stable
          - rustalias: nightly
            rust: nightly
    name: "Build and test ${{ matrix.feature.flags }} Cargo.toml: ${{ matrix.runner.alias }}, ${{ matrix.rustalias }}"
    runs-on: ${{ matrix.runner.id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: ${{ matrix.rust }}
          bins: cargo-nextest
          cache-extra-identifier: ${{ runner.os }}-${{ matrix.rustalias }}-${{ matrix.feature.key }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that the benches can be built
        run: cargo build --benches
      - run: cargo nextest run --manifest-path ${{ github.workspace }}/Cargo.toml --all --lib --bins --tests --examples ${{ matrix.feature.flags }}
  check_fuzz:
    timeout-minutes: 10
    needs:
      - cargo_fmt
      - style_and_docs
      - cargo_semver
      - dependency_review
    if: needs.dependency_review.result == 'success' || needs.dependency_review.result == 'skipped'
    strategy:
      matrix:
        runner:
          - { alias: windows-latest, id: windows-latest }
          - { alias: macOS-latest, id: macOS-latest }
          - { alias: ubuntu-latest, id: "${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}" }
        feature:
          - { key: all-features, flags: "--all-features" }
          - { key: default, flags: "" }
          - { key: zlib-rs, flags: "--no-default-features --features zip/deflate-flate2-zlib-rs" }
          - { key: zopfli, flags: "--no-default-features --features zip/deflate-zopfli" }
          - { key: no-default-features, flags: "--no-default-features" }
        rustalias: [stable, nightly]
        include:
          - rustalias: stable
            rust: stable
          - rustalias: nightly
            rust: nightly
    name: "Build and test ${{ matrix.feature.flags }} fuzz/Cargo.toml: ${{ matrix.runner.alias }}, ${{ matrix.rustalias }}"
    runs-on: ${{ matrix.runner.id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: ${{ matrix.rust }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: rustc-version
        shell: pwsh
        run: |
          $rustcInfo = rustc -Vv
          $release = ($rustcInfo | Select-String '^release: ').ToString() -replace '^release: ', ''
          $commit = ($rustcInfo | Select-String '^commit-hash: ').ToString() -replace '^commit-hash: ', ''
          "version=$release-$commit" >> $env:GITHUB_OUTPUT
      - id: cpu-features
        shell: pwsh
        run: |
          $cpuFeatures = rustc -C target-cpu=native --print cfg | Select-String '^target_feature=' | ForEach-Object { $_.Line } | Sort-Object
          $cpuFingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($cpuFeatures -join "`n")))).ToLowerInvariant()
          "hash=$cpuFingerprint" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: ${{ runner.os }}-${{ runner.arch }}-fuzz-build-${{ steps.rustc-version.outputs.version }}-${{ steps.cpu-features.outputs.hash }}-${{ matrix.feature.key }}-${{ hashFiles('Cargo.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fuzz-build-${{ steps.rustc-version.outputs.version }}-${{ steps.cpu-features.outputs.hash }}-${{ matrix.feature.key }}-
      - run: cargo test --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml --all ${{ matrix.feature.flags }} --bins --tests --examples
  wasm:
    timeout-minutes: 10
    strategy:
      matrix:
        browser_flags: ["--headless --chrome", "--headless --firefox", "--node"]
        rustalias: [stable, nightly]
        manifest: ["Cargo.toml"]
        feature:
          - { key: optional-dates, flags: "--features chrono,jiff-02,nt-time,legacy-zip" }
          - { key: default, flags: "" }
          - { key: no-default-features, flags: "--no-default-features" }
        include:
          - rustalias: stable
            rust: stable
          - rustalias: nightly
            rust: nightly
    runs-on: ${{ vars.LINUX_RUNNER_CI_WASM || 'ubuntu-latest' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: ${{ matrix.rust }}
          bins: wasm-pack
          cache-extra-identifier: wasm-${{ runner.os }}-${{ matrix.feature.key }}-${{ matrix.browser_flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Conditionally set env
        if: matrix.browser_flags != '--node' # if browser testing
        run: echo "WASM_BINDGEN_USE_BROWSER=1" >> $GITHUB_ENV
      - run: wasm-pack test ${{ matrix.browser_flags }} --manifest-path ${{ github.workspace }}/${{ matrix.manifest }} ${{ matrix.feature.flags }}
  cargo_semver:
    timeout-minutes: 10
    strategy:
      matrix:
        # Only do semver checks on the released library.
        workspace: ["Cargo.toml"]
        feature_group:
          ["all-features", "default-features", "only-explicit-features"]
    name: "Semver checks: ${{ matrix.feature_group }}"
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          manifest-path: ${{ github.workspace }}/${{ matrix.workspace }}
          feature-group: ${{ matrix.feature_group }}
  cargo_fmt:
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false\
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          components: rustfmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: fmt fuzz
        run: cargo fmt --all --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- --check
  fuzz_regressions:
    # Fast, deterministic, required: replays seed corpus + known-bad inputs with
    # a plain (non-AFL) release build. Seconds, not hours.
    needs:
      - setup_cargo_afl
      - check_fuzz
    timeout-minutes: 15
    strategy:
      matrix:
        target: [read, write]
        feature:
          - { key: all-features, flags: "--all-features" }
          - { key: no-default-features, flags: "--no-default-features" }
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          cache-target: release
          cache-extra-identifier: fuzz-${{ matrix.feature.key }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: rustc-version
        shell: pwsh
        run: |
          $rustcInfo = rustc -Vv
          $release = ($rustcInfo | Select-String '^release: ').ToString() -replace '^release: ', ''
          $commit = ($rustcInfo | Select-String '^commit-hash: ').ToString() -replace '^commit-hash: ', ''
          "version=$release-$commit" >> $env:GITHUB_OUTPUT
      - id: afl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/afl.rs
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-afl-runtime-v1-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('tools/cargo-afl-version/Cargo.toml') }}
      - id: cpu-features
        shell: pwsh
        run: |
          $cpuFeatures = rustc -C target-cpu=native --print cfg | Select-String '^target_feature=' | ForEach-Object { $_.Line } | Sort-Object
          $cpuFingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($cpuFeatures -join "`n")))).ToLowerInvariant()
          "hash=$cpuFingerprint" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: ${{ runner.os }}-${{ runner.arch }}-fuzz-${{ steps.rustc-version.outputs.version }}-${{ steps.cpu-features.outputs.hash }}-${{ matrix.target }}-${{ matrix.feature.key }}-${{ hashFiles('Cargo.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fuzz-${{ steps.rustc-version.outputs.version }}-${{ steps.cpu-features.outputs.hash }}-${{ matrix.target }}-${{ matrix.feature.key }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-afl-linux
          path: ${{ runner.temp }}/cargo-afl-artifact
      - name: Install cargo-afl
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/bin"
          cp "$RUNNER_TEMP/cargo-afl-artifact/cargo-afl" "$HOME/.cargo/bin/cargo-afl"
          chmod +x "$HOME/.cargo/bin/cargo-afl"
          mkdir -p "$HOME/.local/share/afl.rs"
          tar -xzf "$RUNNER_TEMP/cargo-afl-artifact/afl-data.tar.gz" -C "$HOME/.local/share/afl.rs"
      - name: Install cargo-afl locally if nightly advanced
        if: steps.rustc-version.outputs.version != needs.setup_cargo_afl.outputs.rustc-version && steps.afl-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-cargo-tool.sh cargo-afl tools/cargo-afl-version/Cargo.toml --force
      - name: Build AFL runtime if nightly advanced
        if: steps.rustc-version.outputs.version != needs.setup_cargo_afl.outputs.rustc-version && steps.afl-cache.outputs.cache-hit != 'true'
        run: cargo afl config --build --force
      # Same cfg(fuzzing) semantics as the fuzzer; the AFL binary also runs standalone on stdin.
      - run: cargo afl build --release ${{ matrix.feature.flags }} -p fuzz_${{ matrix.target }} --manifest-path fuzz/Cargo.toml
      - run: fuzz/replay.sh fuzz/target/release/fuzz_${{ matrix.target }} 10 fuzz/${{ matrix.target }}/in fuzz/${{ matrix.target }}/regressions

  setup_cargo_afl:
    timeout-minutes: 20
    outputs:
      rustc-version: ${{ steps.rustc-version.outputs.version }}
    needs:
      - cargo_fmt
      - style_and_docs
      - cargo_semver
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache-base: master
          channel: nightly
          cache-target: release
          cache-extra-identifier: fuzz-${{ matrix.feature.key }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: rustc-version
        shell: pwsh
        run: |
          $rustcInfo = rustc -Vv
          $release = ($rustcInfo | Select-String '^release: ').ToString() -replace '^release: ', ''
          $commit = ($rustcInfo | Select-String '^commit-hash: ').ToString() -replace '^commit-hash: ', ''
          "version=$release-$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - id: afl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-afl
            ~/.cargo/.crates2.json
            ~/.cargo/.crates.toml
            ~/.local/share/afl.rs
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-afl-runtime-v1-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('tools/cargo-afl-version/Cargo.toml') }}
      - run: bash .github/scripts/install-cargo-tool.sh cargo-afl tools/cargo-afl-version/Cargo.toml
      - name: Build AFL runtime
        if: steps.afl-cache.outputs.cache-hit != 'true'
        run: cargo afl config --build --force
      - name: Stage cargo-afl and runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-afl-artifact"
          cp "$HOME/.cargo/bin/cargo-afl" "$RUNNER_TEMP/cargo-afl-artifact/"
          tar -czf "$RUNNER_TEMP/cargo-afl-artifact/afl-data.tar.gz" -C "$HOME/.local/share/afl.rs" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-afl-linux
          path: ${{ runner.temp }}/cargo-afl-artifact/
          if-no-files-found: error

