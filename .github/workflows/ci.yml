name: CI Trigger
on:
  pull_request:
    branches:
      - "master"
      - "backport/*"
  push:
    branches:
      - "master"
      - "backport/*"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  run-ci:
    if: github.actor != 'github-merge-queue[bot]'
    uses: ./.github/workflows/ci-impl.yaml
    permissions:
      contents: read
      security-events: write # for SARIF upload
  ci-complete:
    name: CI Complete
    needs: run-ci
    runs-on: ubuntu-latest
    if: github.actor != 'github-merge-queue[bot]'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check if tests actually ran
        run: |
          if [ "${{ needs.run-ci.result }}" != "success" ]; then
            echo "Error: Required test suite failed or was skipped!"
            exit 1
          fi