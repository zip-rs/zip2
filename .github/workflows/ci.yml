name: CI Trigger
on:
  pull_request:
    branches:
      - "master"
      - "backport/*"
  push:
    branches:
      - "master"
      - "backport/*"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  run-ci:
    if: github.actor != 'github-merge-queue[bot]'
    uses: ./.github/workflows/ci-impl.yaml
  ci-complete:
    name: CI Complete
    needs: run-ci
    runs-on: ubuntu-latest
    steps:
      - run: "true"