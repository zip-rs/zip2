name: CI Trigger
on:
  pull_request:
    branches:
      - "master"
      - "backport/*"
  push:
    branches:
      - "master"
      - "backport/*"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-trigger-${{ (github.ref == 'refs/heads/master' && github.sha) || (github.event_name == 'pull_request' && github.head_ref) || github.ref }}
  cancel-in-progress: false

jobs:
  run-ci:
    if: github.actor != 'github-merge-queue[bot]'
    uses: ./.github/workflows/ci-impl.yaml
    permissions:
      contents: read
      security-events: write # for SARIF upload
  ci-complete:
    name: CI Complete
    needs: run-ci
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - run: "true"