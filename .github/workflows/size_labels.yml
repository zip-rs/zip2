name: "Pull request size labels"

on:
  pull_request:

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'ubuntu-latest' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: boschresearch/pr-size-labeler@6a93d42dd5199ee28d5f41edc359aa5218b4fa7e # v5.0.4
        with:
          bucketConfigFile: ".github/size-buckets.yml"