name: "Pull request size labels"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: size-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'ubuntu-latest' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # 1.8.3
        with:
          persist-credentials: false
          sparse-checkout: .github/size-buckets.yml
          sparse-checkout-cone-mode: false
      - uses: boschresearch/pr-size-labeler@6a93d42dd5199ee28d5f41edc359aa5218b4fa7e # v5.0.4
        with:
          bucketConfigFile: ".github/size-buckets.yml"