name: "Pull request size labels"

on: [pull_request_target]

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Size Labeler
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644
        with:
          xs_label: 'size: tiny'
          xs_max_size: '25'
          s_label: 'size: small'
          s_max_size: '150'
          m_label: 'size: medium'
          m_max_size: '500'
          l_label: 'size: large'
          l_max_size: '1000'
          xl_label: 'size: huge'
          files_to_ignore: |
            'tests/data/*'
            'tests/data/*'
            'CHANGELOG.md'
