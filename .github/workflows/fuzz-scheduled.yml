name: Fuzz (scheduled, long)
permissions:
  contents: read
on:
  schedule:
    - cron: "17 3 * * *"   # nightly
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration per target"
        default: "7200"
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: read,  feature: all-features, flags: "--all-features" }
          - { target: read,  feature: default, flags: "" }
          - { target: write, feature: all-features, flags: "--all-features", dict: "-x fuzz/write/fuzz.dict" }
          - { target: write, feature: no-default-features, flags: "--no-default-features", dict: "-x fuzz/write/fuzz.dict" }
    runs-on: ${{ vars.LINUX_RUNNER_FUZZ_SCHEDULED || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - name: Setup Rust and Cargo
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: nightly
          bins: cargo-afl
          components: clippy
      - run: cargo afl system-config
      - run: cargo afl build --release ${{ matrix.flags }} -p fuzz_${{ matrix.target }} --manifest-path fuzz/Cargo.toml
      - name: fuzz
        env:
          AFL_NO_UI: 1
        run: >
          cargo afl fuzz -t 1000 -i fuzz/${{ matrix.target }}/in -o out
          -V ${{ inputs.seconds || '7200' }} ${{ matrix.dict }}
          -- fuzz/target/release/fuzz_${{ matrix.target }}
      - name: Triage (crashes always fail; hangs only if reproducible at 10 s)
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          c=(out/default/crashes/id*); [ ${#c[@]} -gt 0 ] && { echo "::error::${#c[@]} crashes"; exit 1; }
          fuzz/replay.sh fuzz/target/release/fuzz_${{ matrix.target }} 10 out/default/hangs
      - run: find out -name '*:*' -exec bash -c 'mv "$0" "${0//:/-}"' {} \;
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz_${{ matrix.target }}_${{ strategy.job-index }}_findings
          path: |
            out/default/crashes
            out/default/hangs
            out/default/queue
          if-no-files-found: ignore
      # Findings are triaged by a human (copy into fuzz/<target>/regressions/ with the fix);
      # never block the merge queue on a nightly result.
