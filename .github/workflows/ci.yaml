name: CI
permissions:
  contents: read

concurrency:
  group: ci-${{ (github.ref == 'refs/heads/master' && github.sha) || (github.event_name == 'pull_request' && github.head_ref) || github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

env:
  RUSTFLAGS: -Dwarnings
  # Short smoke fuzz for PRs and the merge queue; long campaigns live in fuzz-scheduled.yml
  FUZZ_SECONDS: 600
  MACOSX_DEPLOYMENT_TARGET: "14.5"

jobs:
  miri:
    needs:
    - cargo_semver
    - style_and_docs
    - cargo_fmt
    timeout-minutes: 20
    strategy:
      matrix:
        feature_flag:
          - "--no-default-features"
          - "--no-default-features --features zip/_miri_compatible_features"
    name: "Miri ${{ matrix.feature_flag }} Cargo.toml"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
      - run: sudo apt update
      - run: sudo apt install crossbuild-essential-s390x
      - run: rustup toolchain add nightly-x86_64-unknown-linux-gnu
      - run: rustup toolchain add --force-non-host stable-s390x-unknown-linux-gnu
      - run: rustup target add s390x-unknown-linux-gnu --toolchain stable-s390x-unknown-linux-gnu
      - run: rustup component add --toolchain nightly-x86_64-unknown-linux-gnu miri
      - run: cargo install --locked cargo-nextest
      - run: cargo +nightly miri nextest run --manifest-path ${{ github.workspace }}/Cargo.toml --target s390x-unknown-linux-gnu --all ${{ matrix.feature_flag }} --lib --bins --tests --examples
  bsd_platform:
    needs:
    - cargo_semver
    - style_and_docs
    - cargo_fmt
    timeout-minutes: 20
    name: "BSD checks"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
      - run: sudo apt update
      - run: sudo snap install --beta zig --classic
      - run: cargo install cargo-zigbuild
      - run: rustup target add x86_64-unknown-freebsd
      - run: cargo zigbuild --all-features --target x86_64-unknown-freebsd --all --lib --bins --tests --examples
  check_minimal_versions:
    needs:
      - cargo_semver
      - style_and_docs
      - cargo_fmt
    timeout-minutes: 15
    strategy:
      matrix:
        # Only check minimal versions for the released library.
        workspace: ["Cargo.toml"]
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly
      - name: resolve minimal versions
        run: cargo +nightly -Z minimal-versions update --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
      - name: check
        run: cargo +nightly check --all-features --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
      - run: cargo install --locked cargo-nextest
      - name: test
        run: cargo +nightly nextest run --all-features --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}

  style_and_docs:
    timeout-minutes: 10
    strategy:
      matrix:
        workspace: ["Cargo.toml", "fuzz/Cargo.toml"]
        feature_flag: ["--all-features", "--no-default-features", ""]
    permissions:
      security-events: write # for SARIF upload
    name: "Style and docs ${{ matrix.feature_flag }} ${{ matrix.workspace }}"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add clippy
      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt
      - name: Run clippy - inside bash for pipefail
        shell: bash
        # allow warnings but not errors
        run: cargo +nightly clippy --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/${{ matrix.workspace }} --message-format=json -- -D warnings | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
      - run: cargo doc --no-deps --workspace ${{ matrix.feature_flag }} --manifest-path ${{ github.workspace }}/${{ matrix.workspace }}
  dependency_review:
    timeout-minutes: 20
    name: 'Dependency Review'
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            api.deps.dev:443
            api.securityscorecards.dev:443
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  build_and_test:
    timeout-minutes: 25
    needs:
      - cargo_fmt
      - style_and_docs
      - miri
      - check_minimal_versions
      - cargo_semver
      - dependency_review
    strategy:
      matrix:
        os: [windows-latest, macOS-latest, ubuntu-latest]
        rustalias: [stable, nightly, msrv]
        feature_flag:
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features zip/deflate-flate2-zlib-rs"
          - "--no-default-features --features zip/deflate-zopfli"
          - ""
        include:
          - rustalias: stable
            rust: stable
            nextest_flag: ""
          - rustalias: msrv
            rust: "1.88.0"
            nextest_flag: "--version 0.9.114"
          - rustalias: nightly
            rust: nightly
            nextest_flag: ""
    name: "Build and test ${{ matrix.feature_flag }} Cargo.toml: ${{ matrix.os }}, ${{ matrix.rustalias }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add ${{ matrix.rust }} && rustup default ${{ matrix.rust }}
      - name: Check that the benches can be built
        run: cargo build --benches
      - run: cargo check --manifest-path ${{ github.workspace }}/Cargo.toml --all ${{ matrix.feature_flag }} --bins --examples
      - run: cargo test --manifest-path ${{ github.workspace }}/Cargo.toml --all ${{ matrix.feature_flag }}
  check_fuzz:
    timeout-minutes: 10
    needs:
      - cargo_fmt
      - style_and_docs
      - cargo_semver
      - dependency_review
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        rustalias: [stable, nightly]
        feature_flag:
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features zip/deflate-flate2-zlib-rs"
          - "--no-default-features --features zip/deflate-zopfli"
          - ""
        include:
          - rustalias: stable
            rust: stable
          - rustalias: nightly
            rust: nightly
    name: "Build and test ${{ matrix.feature_flag }} fuzz/Cargo.toml: ${{ matrix.os }}, ${{ matrix.rustalias }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add ${{ matrix.rust }} && rustup default ${{ matrix.rust }}
      - run: cargo check --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml --all ${{ matrix.feature_flag }} --bins --examples
      - run: cargo build --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml --all ${{ matrix.feature_flag }} --bins --examples
  wasm:
    timeout-minutes: 10
    needs:
      - build_and_test
      - check_fuzz
      - bsd_platform
    strategy:
      matrix:
        browser_flags: ["--headless --chrome", "--headless --firefox", "--node"]
        rustalias: [stable, nightly]
        manifest: ["Cargo.toml"]
        feature_flag:
          - "" # default features
          - "--no-default-features"
          - "--features chrono,jiff-02,nt-time,legacy-zip"
        include:
          - rustalias: stable
            rust: stable
          - rustalias: nightly
            rust: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Conditionally set env
        if: matrix.browser_flags != '--node' # if browser testing
        run: echo "WASM_BINDGEN_USE_BROWSER=1" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
      - run: rustup toolchain add ${{ matrix.rust }} && rustup default ${{ matrix.rust }}
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack test ${{ matrix.browser_flags }} --manifest-path ${{ github.workspace }}/${{ matrix.manifest }} ${{ matrix.feature_flag }}
  cargo_semver:
    timeout-minutes: 10
    strategy:
      matrix:
        # Only do semver checks on the released library.
        workspace: ["Cargo.toml"]
        feature_group:
          ["all-features", "default-features", "only-explicit-features"]
    name: "Semver checks: ${{ matrix.feature_group }}"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          manifest-path: ${{ github.workspace }}/${{ matrix.workspace }}
          feature-group: ${{ matrix.feature_group }}
  cargo_fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.toml') }}
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: fmt fuzz
        run: cargo fmt --all --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- --check
  fuzz_regressions:
    # Fast, deterministic, required: replays seed corpus + known-bad inputs with
    # a plain (non-AFL) release build. Seconds, not hours.
    timeout-minutes: 15
    needs:
      - check_fuzz
    strategy:
      matrix:
        target: [read, write]
        feature_flag: ["--all-features", "--no-default-features"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly
      - run: cargo install cargo-afl --version 0.15.19
      # Same cfg(fuzzing) semantics as the fuzzer; the AFL binary also runs standalone on stdin.
      - run: cargo afl build --release ${{ matrix.feature_flag }} -p fuzz_${{ matrix.target }} --manifest-path fuzz/Cargo.toml
      - run: fuzz/replay.sh fuzz/target/release/fuzz_${{ matrix.target }} 10 fuzz/${{ matrix.target }}/in fuzz/${{ matrix.target }}/regressions

  fuzz_read:
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - wasm
      - check_fuzz
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add clippy

      - run: cargo install cargo-afl --version 0.15.19

      - name: cargo afl system-config
        run: cargo afl system-config
      - name: clippy
        run: cargo afl clippy --all-features -p fuzz_read --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- -D warnings
      - name: compile fuzz
        run: cargo afl build --release --all-features -p fuzz_read --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml
      - name: run fuzz
        env:
          AFL_BENCH_UNTIL_CRASH: 1
          # Deterministic-ish: fixed seed, no auto-calibrated 20 ms timeout.
          AFL_NO_UI: 1
        timeout-minutes: 20
        run: cargo afl fuzz -s 1 -t 1000 -i ${{ github.workspace }}/fuzz/read/in -o out -V ${{ env.FUZZ_SECONDS }} -- ${{ github.workspace }}/fuzz/target/release/fuzz_read
      - name: Minimize corpus
        run: cargo afl cmin -i out/default/queue -o out_cmin -- ${{ github.workspace }}/fuzz/target/release/fuzz_read
      - name: Report coverage
        run: cargo afl showmap -C -i out -o map -- ${{ github.workspace }}/fuzz/target/release/fuzz_read
      - run: sudo apt install rename
        if: always()
      - name: Rename files
        if: always()
        run: |
          find out -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find out_cmin -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find map -type f -name '*:*' -exec rename 's/:/-/g' {} \+
      - name: Upload updated corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_read_corpus
          path: out_cmin/*
      - name: Upload any failure inputs
        id: upload_failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_read_bad_inputs
          path: |
            out/default/crashes/*
            out/default/hangs/*
          if-no-files-found: error
        continue-on-error: true
      - name: Fail on crashes, or on hangs that reproduce with a 10 s timeout
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          crashes=(out/default/crashes/id*)
          if [ ${#crashes[@]} -gt 0 ]; then echo "::error::${#crashes[@]} crash(es)"; exit 1; fi
          hangs=(out/default/hangs/id*)
          [ ${#hangs[@]} -eq 0 ] && exit 0
          echo "AFL saved ${#hangs[@]} timeout(s) at -t 1000; replaying at 10 s"
          fuzz/replay.sh fuzz/target/release/fuzz_read 10 out/default/hangs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_read_coverage
          path: map

  fuzz_read_with_no_features:
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - wasm
      - check_fuzz
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add clippy

      - run: cargo install cargo-afl --version 0.15.19

      - name: cargo afl system-config
        run: cargo afl system-config
      - name: clippy
        run: cargo afl clippy --no-default-features -p fuzz_read --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- -D warnings
      - name: compile fuzz
        run: cargo afl build --release -p fuzz_read --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml
      - name: run fuzz
        env:
          AFL_BENCH_UNTIL_CRASH: 1
          # Deterministic-ish: fixed seed, no auto-calibrated 20 ms timeout.
          AFL_NO_UI: 1
        timeout-minutes: 20
        run: cargo afl fuzz -s 1 -t 1000 -i ${{ github.workspace }}/fuzz/read/in -o out -V ${{ env.FUZZ_SECONDS }} -- ${{ github.workspace }}/fuzz/target/release/fuzz_read
      - name: Report coverage
        run: cargo afl showmap -C -i out -o map -- ${{ github.workspace }}/fuzz/target/release/fuzz_read
      - run: sudo apt install rename
        if: always()
      - name: Rename files
        if: always()
        run: |
          find out -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find map -type f -name '*:*' -exec rename 's/:/-/g' {} \+
      - name: Upload any failure inputs
        id: upload_failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_read_bad_inputs_no_features
          path: |
            out/default/crashes/*
            out/default/hangs/*
          if-no-files-found: error
        continue-on-error: true
      - name: Fail on crashes, or on hangs that reproduce with a 10 s timeout
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          crashes=(out/default/crashes/id*)
          if [ ${#crashes[@]} -gt 0 ]; then echo "::error::${#crashes[@]} crash(es)"; exit 1; fi
          hangs=(out/default/hangs/id*)
          [ ${#hangs[@]} -eq 0 ] && exit 0
          echo "AFL saved ${#hangs[@]} timeout(s) at -t 1000; replaying at 10 s"
          fuzz/replay.sh fuzz/target/release/fuzz_read 10 out/default/hangs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_read_coverage_no_features
          path: map

  fuzz_write:
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - wasm
      - check_fuzz
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add clippy

      - run: cargo install cargo-afl --version 0.15.19

      - name: cargo afl system-config
        run: cargo afl system-config
      - name: clippy
        run: cargo afl clippy --all-features -p fuzz_write --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- -D warnings
      - name: compile fuzz
        run: cargo afl build --release --all-features -p fuzz_write --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml
      - name: run fuzz
        env:
          AFL_BENCH_UNTIL_CRASH: 1
          # Deterministic-ish: fixed seed, no auto-calibrated 20 ms timeout.
          AFL_NO_UI: 1
        timeout-minutes: 20
        run: cargo afl fuzz -s 1 -t 1000 -i ${{ github.workspace }}/fuzz/write/in -o out -V ${{ env.FUZZ_SECONDS }} -x ${{ github.workspace }}/fuzz/write/fuzz.dict -- ${{ github.workspace }}/fuzz/target/release/fuzz_write
      - name: Minimize corpus
        run: cargo afl cmin -i out/default/queue -o out_cmin -- ${{ github.workspace }}/fuzz/target/release/fuzz_write
      - name: Report coverage
        run: cargo afl showmap -C -i out -o map -- ${{ github.workspace }}/fuzz/target/release/fuzz_write
      - run: sudo apt install rename
        if: always()
      - name: Rename files
        if: always()
        run: |
          find out -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find out_cmin -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find map -type f -name '*:*' -exec rename 's/:/-/g' {} \+
      - name: Upload updated corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_write_corpus
          path: out_cmin/*
      - name: Upload any failure inputs
        id: upload_failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_write_bad_inputs
          path: |
            out/default/crashes/*
            out/default/hangs/*
          if-no-files-found: error
        continue-on-error: true
      - name: Fail on crashes, or on hangs that reproduce with a 10 s timeout
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          crashes=(out/default/crashes/id*)
          if [ ${#crashes[@]} -gt 0 ]; then echo "::error::${#crashes[@]} crash(es)"; exit 1; fi
          hangs=(out/default/hangs/id*)
          [ ${#hangs[@]} -eq 0 ] && exit 0
          echo "AFL saved ${#hangs[@]} timeout(s) at -t 1000; replaying at 10 s"
          fuzz/replay.sh fuzz/target/release/fuzz_write 10 out/default/hangs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_write_coverage
          path: map

  fuzz_write_with_no_features:
    runs-on: ubuntu-latest
    needs:
      - build_and_test
      - wasm
      - check_fuzz
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly && rustup component add clippy

      - run: cargo install cargo-afl --version 0.15.19

      - name: cargo afl system-config
        run: cargo afl system-config
      - name: clippy
        run: cargo afl clippy --no-default-features -p fuzz_write --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml -- -D warnings
      - name: compile fuzz
        run: cargo afl build --release --no-default-features -p fuzz_write --manifest-path ${{ github.workspace }}/fuzz/Cargo.toml
      - name: run fuzz
        env:
          AFL_BENCH_UNTIL_CRASH: 1
          # Deterministic-ish: fixed seed, no auto-calibrated 20 ms timeout.
          AFL_NO_UI: 1
        timeout-minutes: 20
        run: cargo afl fuzz -s 1 -t 1000 -i ${{ github.workspace }}/fuzz/write/in -o out -V ${{ env.FUZZ_SECONDS }} -x ${{ github.workspace }}/fuzz/write/fuzz.dict -- ${{ github.workspace }}/fuzz/target/release/fuzz_write
      - name: Report coverage
        run: cargo afl showmap -C -i out -o map -- ${{ github.workspace }}/fuzz/target/release/fuzz_write
      - run: sudo apt install rename
        if: always()
      - name: Rename files
        if: always()
        run: |
          find out -type f -name '*:*' -exec rename 's/:/-/g' {} \+
          find map -type f -name '*:*' -exec rename 's/:/-/g' {} \+
      - name: Upload any failure inputs
        id: upload_failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_write_bad_inputs_no_features
          path: |
            out/default/crashes/*
            out/default/hangs/*
          if-no-files-found: error
        continue-on-error: true
      - name: Fail on crashes, or on hangs that reproduce with a 10 s timeout
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          crashes=(out/default/crashes/id*)
          if [ ${#crashes[@]} -gt 0 ]; then echo "::error::${#crashes[@]} crash(es)"; exit 1; fi
          hangs=(out/default/hangs/id*)
          [ ${#hangs[@]} -eq 0 ] && exit 0
          echo "AFL saved ${#hangs[@]} timeout(s) at -t 1000; replaying at 10 s"
          fuzz/replay.sh fuzz/target/release/fuzz_write 10 out/default/hangs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz_write_coverage_no_features
          path: map
