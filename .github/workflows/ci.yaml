name: CI
permissions:
  contents: read

concurrency:
  group: ci-${{ (github.ref == 'refs/heads/master' && github.sha) || (github.event_name == 'pull_request' && github.head_ref) || github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

env:
  RUSTFLAGS: -Dwarnings
  # Short smoke fuzz for PRs and the merge queue; long campaigns live in fuzz-scheduled.yml
  FUZZ_SECONDS: 20700 # 5h45m
  MACOSX_DEPLOYMENT_TARGET: "14.5"

jobs:
  setup_cargo_afl:
    timeout-minutes: 20
    outputs:
      rustc-version: ${{ steps.rustc-version.outputs.version }}
    runs-on: ${{ vars.LINUX_RUNNER_CI_PRELIMINARY || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - run: rustup toolchain add nightly && rustup default nightly
      - id: rustc-version
        shell: pwsh
        run: |
          $rustcInfo = rustc -Vv
          $release = ($rustcInfo | Select-String '^release: ').ToString() -replace '^release: ', ''
          $commit = ($rustcInfo | Select-String '^commit-hash: ').ToString() -replace '^commit-hash: ', ''
          "version=$release-$commit" >> $env:GITHUB_OUTPUT
      - id: afl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-afl
            ~/.cargo/.crates2.json
            ~/.cargo/.crates.toml
            ~/.local/share/afl.rs
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-afl-runtime-v1-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('tools/cargo-afl-version/Cargo.toml') }}
      - run: bash .github/scripts/install-cargo-tool.sh cargo-afl tools/cargo-afl-version/Cargo.toml
      - name: Build AFL runtime
        if: steps.afl-cache.outputs.cache-hit != 'true'
        run: cargo afl config --build --force
      - name: Stage cargo-afl and runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-afl-artifact"
          cp "$HOME/.cargo/bin/cargo-afl" "$RUNNER_TEMP/cargo-afl-artifact/"
          tar -czf "$RUNNER_TEMP/cargo-afl-artifact/afl-data.tar.gz" -C "$HOME/.local/share/afl.rs" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-afl-linux
          path: ${{ runner.temp }}/cargo-afl-artifact/
          if-no-files-found: error
  fuzz_read:
    runs-on: ${{ vars.LINUX_RUNNER_CI_FINAL_FUZZ || 'ubuntu-latest' }}
    needs:
      - setup_cargo_afl
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-ci
        with:
          target: read
          feature-key: all-features
          clippy-flags: --all-features
          build-flags: --all-features
          minimize: "true"
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          setup-rustc-version: ${{ needs.setup_cargo_afl.outputs.rustc-version }}

  fuzz_read_with_no_features:
    runs-on: ${{ vars.LINUX_RUNNER_CI_FINAL_FUZZ || 'ubuntu-latest' }}
    needs:
      - setup_cargo_afl
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-ci
        with:
          target: read
          feature-key: no-default-features
          clippy-flags: --no-default-features
          build-flags: --no-default-features
          minimize: "false"
          artifact-suffix: _no_features
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          setup-rustc-version: ${{ needs.setup_cargo_afl.outputs.rustc-version }}

  fuzz_write:
    runs-on: ${{ vars.LINUX_RUNNER_CI_FINAL_FUZZ || 'ubuntu-latest' }}
    needs:
      - setup_cargo_afl
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-ci
        with:
          target: write
          feature-key: all-features
          clippy-flags: --all-features
          build-flags: --all-features
          dictionary: -x ${{ github.workspace }}/fuzz/write/fuzz.dict
          minimize: "true"
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          setup-rustc-version: ${{ needs.setup_cargo_afl.outputs.rustc-version }}

  fuzz_write_with_no_features:
    runs-on: ${{ vars.LINUX_RUNNER_CI_FINAL_FUZZ || 'ubuntu-latest' }}
    needs:
      - setup_cargo_afl
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # 1.8.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-ci
        with:
          target: write
          feature-key: no-default-features
          clippy-flags: --no-default-features
          build-flags: --no-default-features
          dictionary: -x ${{ github.workspace }}/fuzz/write/fuzz.dict
          minimize: "false"
          artifact-suffix: _no_features
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          setup-rustc-version: ${{ needs.setup_cargo_afl.outputs.rustc-version }}
