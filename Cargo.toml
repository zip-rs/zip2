[package]
name = "zip"
version = "9.2.0"
authors = [
    "Mathijs van de Nes <git@mathijs.vd-nes.nl>",
    "Marli Frost <marli@frost.red>",
    "Ryan Levick <ryan.levick@gmail.com>",
    "Chris Hennick <hennickc@amazon.com>",
]
license = "MIT"
repository = "https://github.com/zip-rs/zip2"
keywords = ["zip", "archive", "compression"]
# Any change to rust-version must be reflected also in `README.md` and `.github/workflows/ci.yaml`.
# The MSRV policy is documented in `README.md`.
rust-version = "1.88"
categories = ["compression", "filesystem", "parser-implementations"]
description = "Library to support the reading and writing of zip files."
edition = "2024"
exclude = ["tests/**", "examples/**", ".github/**", "fuzz/**", ".amazonq/**", "benches/**", ".typos.toml"]

[workspace]
members = [
    ".",
    "crates/zip-core-lib",
    "crates/zip-read",
    "crates/zip-write",
    "crates/zip-extract",
    "crates/zip-add-file",
    "crates/zip-update",
]
resolver = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
zip-core-lib = { path = "crates/zip-core-lib", version = "9.2.0", default-features = false }
zip-read = { path = "crates/zip-read", version = "9.2.0", default-features = false }
zip-write = { path = "crates/zip-write", version = "9.2.0", default-features = false }
zip-extract = { path = "crates/zip-extract", version = "9.2.0", default-features = false }
zip-add-file = { path = "crates/zip-add-file", version = "9.2.0", default-features = false }
zip-update = { path = "crates/zip-update", version = "9.2.0", default-features = false }
arbitrary = { version = "1.4", features = ["derive"], optional = true }
aes = { version = "0.9", optional = true, features = ["zeroize"] }
bzip2 = { version = "0.6", default-features = false, optional = true }
chrono = { version = "^0.4.27", optional = true, default-features = false, features = ["std"] }
constant_time_eq = { version = "^0.6.1", optional = true }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, optional = true }
hmac = { version = "0.13", optional = true, features = ["zeroize"] }
indexmap = "2"
jiff = { version = "^0.2.4", optional = true }
memchr = "2.7"
nt-time = { version = "0.13", default-features = false, optional = true }
ppmd-rust = { version = "1.5", optional = true }
pbkdf2 = { version = "0.13", optional = true }
sha1 = { version = "0.11", optional = true }
zeroize = { version = "1.9", optional = true }
zstd = { version = "^0.14.2", optional = true, default-features = false }
zopfli = { version = "^0.8.3", optional = true }
deflate64 = { version = "^0.1.10", optional = true }
lzma-rust2 = { version = "^0.23.0", optional = true, default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bitstream-io = { version = "4.9", optional = true }
# Only the path parsing is used, which doesn't need std.
typed-path = { version = "0.13", default-features = false }
rayon = { version = "1.11", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
nix = { version = "^0.31.3", features = ["fs"], default-features = false }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4", default-features = false }
time = { version = "^0.3.47", default-features = false, optional = true, features = ["std"] }

# wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
time = { version = "^0.3.47", default-features = false, optional = true, features = [
    "std",
    "wasm-bindgen"
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
wasm-bindgen-test = "^0.3.56"
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10.3"

[target.'cfg(not(miri))'.dev-dependencies]
tempfile = "3.15"
count_instructions = "0.2.1"

[dev-dependencies]
walkdir = "2.5"
time = { version = "^0.3.47", features = ["formatting", "macros"] }
clap = { version = "^4.4.18", features = ["derive"] }
rayon = "1.11"

[features]
rayon = ["dep:rayon", "zip-read/rayon", "zip-write/rayon", "zip-add-file/rayon"]
_arbitrary = ["dep:arbitrary", "zip-core-lib/_arbitrary"]
aes-crypto = ["dep:aes", "dep:constant_time_eq", "getrandom/std", "dep:hmac", "dep:pbkdf2", "dep:sha1", "dep:zeroize", "zip-core-lib/aes-crypto", "zip-read/aes-crypto", "zip-write/aes-crypto", "zip-update/aes-crypto", "zip-add-file/aes-crypto", "zip-extract/aes-crypto"]
chrono = ["dep:chrono", "zip-core-lib/chrono"]
_deflate-any = ["zip-core-lib/_deflate-any", "zip-read/_deflate-any"]
deflate = ["deflate-zopfli", "deflate-flate2-zlib-rs", "zip-core-lib/deflate", "zip-read/deflate", "zip-write/deflate", "zip-update/deflate", "zip-add-file/deflate", "zip-extract/deflate"]
# Pull in flate2, but don't choose a backend; useful if you want to choose your own flate2 backend
deflate-flate2 = ["_deflate-any", "dep:flate2", "zip-core-lib/deflate-flate2", "zip-read/deflate-flate2", "zip-write/deflate-flate2", "zip-update/deflate-flate2", "zip-add-file/deflate-flate2", "zip-extract/deflate-flate2"]
# Pull in flate2 and the fast zlib-rs backend; this is what most users will want
deflate-flate2-zlib-rs = ["deflate-flate2", "flate2/zlib-rs", "zip-core-lib/deflate-flate2-zlib-rs", "zip-read/deflate-flate2-zlib-rs", "zip-write/deflate-flate2-zlib-rs", "zip-update/deflate-flate2-zlib-rs", "zip-add-file/deflate-flate2-zlib-rs", "zip-extract/deflate-flate2-zlib-rs"]
# Pull in zopfli (write-only DEFLATE, slower than flate2 with better compression ratios)
deflate-zopfli = ["dep:zopfli", "_deflate-any", "zip-core-lib/deflate-zopfli", "zip-read/deflate-zopfli", "zip-write/deflate-zopfli", "zip-update/deflate-zopfli", "zip-add-file/deflate-zopfli", "zip-extract/deflate-zopfli"]
# Deprecated: This is a formerly-optional dependency that pre-dates the "dep:" syntax for optional dependencies that aren't features.
# It will be removed in 10.0.0.
getrandom = ["zip-core-lib/getrandom"]
jiff-02 = ["dep:jiff", "zip-core-lib/jiff-02"]
nt-time = ["dep:nt-time", "zip-core-lib/nt-time"]
lzma = ["dep:lzma-rust2", "zip-core-lib/lzma", "zip-read/lzma", "zip-write/lzma", "zip-update/lzma", "zip-extract/lzma", "zip-add-file/lzma"]
ppmd = ["dep:ppmd-rust", "zip-core-lib/ppmd", "zip-read/ppmd", "zip-write/ppmd", "zip-update/ppmd", "zip-extract/ppmd", "zip-add-file/ppmd"]
# This feature allows writing custom extra-data field IDs in file headers.
unreserved = ["zip-core-lib/unreserved"]
xz = ["dep:lzma-rust2", "zip-core-lib/xz", "zip-read/xz", "zip-write/xz", "zip-update/xz", "zip-extract/xz", "zip-add-file/xz"]
_bzip2_any = ["zip-core-lib/_bzip2_any"]
bzip2 = ["dep:bzip2", "bzip2/default", "_bzip2_any", "zip-core-lib/bzip2", "zip-read/bzip2", "zip-write/bzip2", "zip-update/bzip2", "zip-extract/bzip2", "zip-add-file/bzip2"]
legacy-zip = ["bitstream-io", "zip-core-lib/legacy-zip", "zip-read/legacy-zip", "zip-update/legacy-zip", "zip-add-file/legacy-zip", "zip-extract/legacy-zip"]
time = ["dep:time", "zip-core-lib/time", "zip-write/time", "zip-update/time", "zip-extract/time", "zip-add-file/time"]
deflate64 = ["dep:deflate64", "zip-core-lib/deflate64", "zip-read/deflate64", "zip-write/deflate64", "zip-update/deflate64", "zip-extract/deflate64", "zip-add-file/deflate64"]
default = [
    "aes-crypto",
    "bzip2",
    "deflate64",
    "deflate",
    "lzma",
    "ppmd",
    "time",
    "zstd",
    "xz",
]
zstd = ["dep:zstd", "zip-core-lib/zstd", "zip-read/zstd", "zip-write/zstd", "zip-update/zstd", "zip-extract/zstd", "zip-add-file/zstd"]
_miri_compatible_features = [
    # Not "aes-crypto" (too slow),
    "bzip2",
    "chrono",
    "deflate-flate2",
    "flate2/rust_backend",
    "deflate-zopfli",
    "jiff-02",
    "legacy-zip",
    "lzma",
    "nt-time",
    "ppmd",
    "unreserved",
    "xz",
    "time",
    # Not "zstd" (uses C functions),
]

# The following features are not supported on wasm
bzip2-rs = ["dep:bzip2", "bzip2/bzip2-sys", "_bzip2_any", "zip-core-lib/bzip2-rs", "zip-read/bzip2-rs", "zip-write/bzip2-rs", "zip-update/bzip2-rs", "zip-add-file/bzip2-rs", "zip-extract/bzip2-rs"]
# Pull in flate2 and the zlib backend; only use this if you need a dynamically linked system zlib
deflate-flate2-zlib = ["deflate-flate2", "flate2/zlib", "zip-core-lib/deflate-flate2-zlib", "zip-read/deflate-flate2-zlib", "zip-write/deflate-flate2-zlib", "zip-add-file/deflate-flate2-zlib", "zip-extract/deflate-flate2-zlib"]
# Pull in flate2 and the zlib-ng backend; a modern fork of zlib
deflate-flate2-zlib-ng = ["deflate-flate2", "flate2/zlib-ng", "zip-core-lib/deflate-flate2-zlib-ng", "zip-read/deflate-flate2-zlib-ng", "zip-write/deflate-flate2-zlib-ng", "zip-add-file/deflate-flate2-zlib-ng", "zip-extract/deflate-flate2-zlib-ng"]
# Pull in flate2 and the zlib-ng backend with a zlib-compatible API
deflate-flate2-zlib-ng-compat = ["deflate-flate2", "flate2/zlib-ng-compat", "zip-core-lib/deflate-flate2-zlib-ng-compat", "zip-read/deflate-flate2-zlib-ng-compat", "zip-write/deflate-flate2-zlib-ng-compat", "zip-add-file/deflate-flate2-zlib-ng-compat", "zip-extract/deflate-flate2-zlib-ng-compat"]

[[bench]]
name = "deflate_alloc"
harness = false
required-features = ["_deflate-any"]

[[bench]]
name = "file_io"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "zip_file_list"
harness = false

[[bench]]
name = "aes"
harness = false
required-features = ["aes-crypto"]

[[bench]]
name = "extract"
harness = false
required-features = ["rayon"]
